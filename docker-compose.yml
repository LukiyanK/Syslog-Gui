services:
  syslog-gui:
    build: .
    ports:
      - "8080:8080"
      # Syslog: проброс диапазона, чтобы порт из веб-интерфейса работал без правки compose.
      # На старых Docker при большом диапазоне первый старт может занять время — сузьте при необходимости.
      - "5000-5999:5000-5999/udp"
      - "5000-5999:5000-5999/tcp"
    volumes:
      - syslog_data:/data
    environment:
      DATA_DIR: /data
    restart: unless-stopped

volumes:
  syslog_data:
